# Durcissement SSH - S1 à S4
# Le fichier commence par 10- : sshd garde la première valeur lue,
# il passe donc avant les autres fichiers du dossier.

# S1 : clé uniquement
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# S2
PermitRootLogin no

# S3
AllowGroups acces_ssh

# S4 : 3 essais, session sans activité fermée après 10 min
MaxAuthTries 3
LoginGraceTime 30
ChannelTimeout session=10m
UnusedConnectionTimeout 5m
ClientAliveInterval 300
ClientAliveCountMax 2

# Fonctions inutiles ici
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
PermitUserEnvironment no
MaxSessions 4

LogLevel VERBOSE
