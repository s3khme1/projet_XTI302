# J1 - protection SSH
[DEFAULT]
banaction = nftables[type=multiport]
banaction_allports = nftables[type=allports]
ignoreip = 127.0.0.1/8 ::1

[sshd]
enabled  = true
backend  = systemd
mode     = aggressive
port     = ssh
maxretry = 5
findtime = 10m
bantime  = 15m
bantime.increment = true
bantime.maxtime = 1d
