#!/usr/sbin/nft -f
# J2 - pare-feu
# Pas de "flush ruleset" : ça supprimerait aussi la table de fail2ban.
# On ne vide que notre table.

table inet filtrage
delete table inet filtrage

table inet filtrage {
    chain entree {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # IPv6 ne fonctionne pas sans découverte des voisins
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } ip6 hoplimit 255 accept

        tcp dport 22 ct state new accept
    }

    chain transit {
        type filter hook forward priority filter; policy drop;
    }

    chain sortie {
        type filter hook output priority filter; policy accept;
    }
}
